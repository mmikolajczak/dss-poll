<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>AI at scale in healthcare · DSS round table</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%2327406b%27/%3E%3Crect x=%2714%27 y=%2734%27 width=%278%27 height=%2716%27 rx=%272%27 fill=%27%232fd3b1%27/%3E%3Crect x=%2728%27 y=%2722%27 width=%278%27 height=%2728%27 rx=%272%27 fill=%27%23fff%27/%3E%3Crect x=%2742%27 y=%2714%27 width=%278%27 height=%2736%27 rx=%272%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f1b33;
    --muted: #5b6780;
    --line: #e3e8f2;
    --bg: #f4f6fb;
    --card: #ffffff;
    --navy: #27406b;
    --navy-soft: #eaf0fb;
    --accent: #1fb59a;
    --accent-soft: #dff6f1;
    --danger: #d6455d;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px; line-height: 1.45; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 120px; }
  header { padding: 6px 4px 18px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); opacity: .8; }
  .title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin-top: 4px; }
  .subtitle { font-size: 14px; color: var(--muted); margin-top: 2px; }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(15,27,51,.04), 0 8px 28px rgba(15,27,51,.07); padding: 22px 18px; }
  .qmeta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .pill { background: var(--navy-soft); color: var(--navy); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  h2 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.01em; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

  .opts { display: grid; gap: 10px; margin-top: 14px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 14px 14px; font: inherit; font-size: 16px; color: var(--ink); cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
  }
  .opt:active { transform: scale(.99); }
  .opt .mark { flex: 0 0 22px; height: 22px; border: 2px solid #b9c3d6; border-radius: 50%; display: grid; place-items: center; transition: all .15s; }
  .opt.multi .mark { border-radius: 7px; }
  .opt.sel { border-color: var(--navy); background: var(--navy-soft); }
  .opt.sel .mark { border-color: var(--navy); background: var(--navy); }
  .opt.sel .mark::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .opt.multi.sel .mark::after { width: 10px; height: 6px; border-radius: 0; background: none; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  .opt.dim { opacity: .5; }

  .field { margin-top: 14px; }
  input[type=email] {
    width: 100%; font: inherit; font-size: 17px; padding: 15px 14px; border: 1.5px solid var(--line); border-radius: 14px; outline: none; background: #fff; color: var(--ink);
  }
  input[type=email]:focus { border-color: var(--navy); box-shadow: 0 0 0 4px var(--navy-soft); }
  .check { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--navy); flex: 0 0 20px; }
  .fine { font-size: 12px; color: var(--muted); margin-top: 12px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(244,246,251,0), var(--bg) 35%); }
  .bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { flex: 1; font: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 14px; padding: 16px; cursor: pointer; transition: opacity .15s, transform .08s; }
  .btn:active { transform: scale(.99); }
  .btn.primary { background: var(--navy); color: #fff; box-shadow: 0 6px 18px rgba(39,64,107,.28); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1.5px solid var(--line); flex: 0 0 auto; padding: 16px 20px; }
  .btn[disabled] { opacity: .45; box-shadow: none; cursor: default; }

  .center { text-align: center; padding: 34px 10px 30px; }
  .icon { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; }
  .icon.wait { background: var(--navy-soft); position: relative; }
  .icon.wait::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--navy-soft); animation: pulse 1.8s ease-out infinite; }
  .icon.wait span { width: 14px; height: 14px; border-radius: 50%; background: var(--navy); position: relative; }
  .icon.ok { background: var(--accent-soft); }
  .icon.ok span { width: 22px; height: 12px; border-left: 3.5px solid var(--accent); border-bottom: 3.5px solid var(--accent); transform: rotate(-45deg) translate(2px,-3px); }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
  .center h3 { margin: 0 0 6px; font-size: 20px; }
  .center p { margin: 0; color: var(--muted); }

  .progress { height: 4px; border-radius: 99px; background: #edf1f7; overflow: hidden; margin: -4px 0 16px; }
  .progress span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .back { font: inherit; font-size: 14px; font-weight: 600; color: var(--navy); background: none; border: 0; padding: 4px 0 4px 10px; cursor: pointer; }
  .hintrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .hintrow .hint { margin: 0; }
  .center .after { margin-top: 14px; color: var(--ink); font-weight: 600; }
  .link { font: inherit; font-size: 14px; color: var(--navy); background: none; border: 0; margin-top: 18px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -80px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; transition: transform .25s; z-index: 10; max-width: 90vw; }
  .toast.show { transform: translate(-50%, 0); }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
  </header>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>
<div class="bar" id="bar" hidden><div class="bar-inner" id="barInner"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzWXRjwTN9aXXCgfoKTeRH2GLWFM8AjUpwA0jVUHKqLbfTFQiHyYPUP2tnjUmiOx_iO/exec';
let BOOT = null;
let QUESTIONS = [];
const QINDEX = {};

/* ---------- transport ---------- */
function api(action, params) {
  const q = new URLSearchParams(Object.assign({ action: action, _: String(Date.now()) }, params || {}));
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 12000) : null;
  return fetch(API + '?' + q.toString(), { method: 'GET', credentials: 'omit', cache: 'no-store', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { if (timer) clearTimeout(timer); if (j && j.error) throw new Error(j.error); return j; })
    .catch(function (e) { if (timer) clearTimeout(timer); throw e; });
}

/* ---------- small helpers ---------- */
function h(tag, attrs, kids) {
  const el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'text') el.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}
const store = {
  mem: {},
  get: function (k) { try { const v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return this.mem[k] || null; },
  set: function (k, v) { this.mem[k] = v; try { window.localStorage.setItem(k, v); } catch (e) {} },
  remove: function (k) { delete this.mem[k]; try { window.localStorage.removeItem(k); } catch (e) {} }
};
function randId() {
  const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  try { const b = new Uint8Array(24); crypto.getRandomValues(b); b.forEach(function (x) { out += a[x % a.length]; }); }
  catch (e) { for (let i = 0; i < 24; i++) out += a[Math.floor(Math.random() * a.length)]; }
  return out;
}
let pid = store.get('drpoll_pid');
if (!pid || !/^[A-Za-z0-9_-]{8,64}$/.test(pid)) { pid = randId(); store.set('drpoll_pid', pid); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ---------- state ---------- */
// Self-paced: everyone goes through all questions on their own. Each answer is saved on the phone
// right away and delivered in the background, so a slow server never holds anyone up.
let round = null;          // answer round from the server; a reset by the presenter starts a new one
let cursor = 0;            // index of the question on screen; QUESTIONS.length = finished
let screenKey = '';
let selection = [];
let failures = 0;

function localKeyFor(r, qid) { return 'drpoll_ans_' + r + '_' + qid; }
function myAnswer(qid) { const v = store.get(localKeyFor(round, qid)); try { return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function firstOpen() { for (let i = 0; i < QUESTIONS.length; i++) if (!myAnswer(QUESTIONS[i].id)) return i; return QUESTIONS.length; }

/* ---------- screens ---------- */
const main = document.getElementById('main');
const bar = document.getElementById('bar');
const barInner = document.getElementById('barInner');

function setBar(buttons) {
  barInner.innerHTML = '';
  if (!buttons || !buttons.length) { bar.hidden = true; return; }
  buttons.forEach(function (b) { barInner.appendChild(b); });
  bar.hidden = false;
}

function renderConnecting() {
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'card center' }, [
    h('div', { class: 'icon wait' }, [h('span')]),
    h('h3', { text: 'Łączę…' }),
    h('p', { text: 'Chwileczkę.' })
  ]));
  setBar(null);
}

function questionHead(q, i) {
  const n = QUESTIONS.length;
  return [
    h('div', { class: 'progress' }, [h('span', { style: 'width:' + Math.round(i * 100 / n) + '%' })]),
    h('div', { class: 'qmeta' }, [
      h('span', { text: 'Pytanie ' + (i + 1) + ' z ' + n }),
      i > 0 ? h('button', { class: 'back', type: 'button', text: '‹ Wstecz', onclick: function () { go(i - 1); } }) : null
    ]),
    h('h2', { text: q.text }),
    (q.hint || q.type === 'multi') ? h('div', { class: 'hintrow' }, [
      q.hint ? h('p', { class: 'hint', text: q.hint }) : h('span'),
      q.type === 'multi' ? h('span', { class: 'pill', id: 'counter', text: '0 / ' + (q.max || 2) }) : null
    ]) : null
  ];
}

function renderChoice(q, i) {
  const multi = q.type === 'multi';
  const max = multi ? (q.max || 2) : 1;
  const prev = myAnswer(q.id);
  selection = prev && prev.choices ? prev.choices.slice() : [];
  const nextBtn = h('button', { class: 'btn primary', text: 'Dalej', onclick: function () { answer(q, i, { choices: selection.slice() }); } });
  const opts = h('div', { class: 'opts' });
  let locked = false;
  const buttons = q.options.map(function (label, k) {
    const b = h('button', { class: 'opt' + (multi ? ' multi' : ''), type: 'button' }, [h('span', { class: 'mark' }), h('span', { text: label })]);
    b.addEventListener('click', function () {
      if (locked) return;
      const at = selection.indexOf(k);
      if (multi) {
        if (at >= 0) selection.splice(at, 1);
        else if (selection.length < max) selection.push(k);
        else { const c = document.getElementById('counter'); if (c) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } toast('Możesz wybrać maksymalnie ' + max); return; }
        paint();
      } else {
        // One tap is enough: show the choice for a moment, then move on.
        selection = [k];
        paint();
        locked = true;
        setTimeout(function () { answer(q, i, { choices: [k] }); }, 260);
      }
    });
    opts.appendChild(b);
    return b;
  });
  function paint() {
    buttons.forEach(function (b, k) {
      b.classList.toggle('sel', selection.indexOf(k) >= 0);
      b.classList.toggle('dim', multi && selection.length >= max && selection.indexOf(k) < 0);
    });
    if (multi) { const c = document.getElementById('counter'); if (c) c.textContent = selection.length + ' / ' + max; }
    if (selection.length) nextBtn.removeAttribute('disabled'); else nextBtn.setAttribute('disabled', 'disabled');
  }
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'card' }, questionHead(q, i).concat([opts])));
  paint();
  setBar(multi ? [nextBtn] : null);
}

function renderEmail(q, i) {
  const prev = myAnswer(q.id);
  const input = h('input', { type: 'email', inputmode: 'email', autocomplete: 'email', placeholder: 'twoj@email.com', 'aria-label': 'E-mail' });
  if (prev && prev.email) input.value = prev.email;
  const consent = h('input', { type: 'checkbox' });
  if (prev && prev.consent) consent.checked = true;
  const sendBtn = h('button', { class: 'btn primary', text: 'Wyślij', onclick: function () {
    const email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { input.focus(); input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); toast('Sprawdź adres e-mail'); return; }
    answer(q, i, { email: email, consent: consent.checked });
  } });
  const skipBtn = h('button', { class: 'btn ghost', text: 'Pomiń', onclick: function () {
    store.set(localKeyFor(round, q.id), JSON.stringify({ skipped: true }));
    go(i + 1);
  } });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendBtn.click(); });
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'card' }, questionHead(q, i).concat([
    h('div', { class: 'field' }, [input]),
    h('label', { class: 'check' }, [consent, h('span', { text: q.consent })]),
    h('p', { class: 'fine', text: q.privacy })
  ])));
  setBar([skipBtn, sendBtn]);
}

function renderDone() {
  const last = QUESTIONS[QUESTIONS.length - 1];
  const mail = last && last.type === 'email' ? myAnswer(last.id) : null;
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'card center' }, [
    h('div', { class: 'icon ok' }, [h('span')]),
    h('h3', { text: 'Dzięki!' }),
    h('p', { text: mail && mail.email ? 'Odpowiedzi zapisane. Notatki wyślemy po evencie.' : 'Odpowiedzi zapisane.' }),
    h('p', { class: 'after', text: 'Wyniki omówimy za chwilę przy stole.' }),
    h('button', { class: 'link', type: 'button', text: 'Zmień odpowiedzi', onclick: function () { go(0); } })
  ]));
  setBar(null);
}

function go(i) {
  cursor = Math.max(0, Math.min(i, QUESTIONS.length));
  screenKey = '';
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (!BOOT || round === null) { if (screenKey !== 'connecting') { screenKey = 'connecting'; renderConnecting(); } return; }
  const key = round + ':' + cursor;
  if (key === screenKey) return;
  screenKey = key;
  if (cursor >= QUESTIONS.length) { renderDone(); return; }
  const q = QUESTIONS[cursor];
  if (q.type === 'email') renderEmail(q, cursor);
  else renderChoice(q, cursor);
}

/* ---------- delivery ---------- */
// Answers go to a small outbox kept in localStorage and are sent one by one, retrying until the
// server confirms. Flaky conference Wi-Fi never blocks the phone, and a reload resumes delivery.
// Changing an answer just sends it again; the server counts the latest one.
const OUTBOX_KEY = 'drpoll_outbox';
function outboxRead() { try { return JSON.parse(store.get(OUTBOX_KEY) || '[]'); } catch (e) { return []; } }
function outboxWrite(list) { store.set(OUTBOX_KEY, JSON.stringify(list)); }
function sameItem(a, b) { return a.round === b.round && a.qid === b.qid; }
let delivering = false;
let deliverTimer = null;

function answer(q, i, payload) {
  const local = q.type === 'email' ? { email: payload.email, consent: !!payload.consent } : { choices: payload.choices };
  store.set(localKeyFor(round, q.id), JSON.stringify(local));
  const item = { round: round, qid: q.id, p: payload, tries: 0 };
  outboxWrite(outboxRead().filter(function (x) { return !sameItem(x, item); }).concat([item]));
  deliver();
  go(i + 1);
}

function deliver() {
  if (delivering || round === null) return;
  clearTimeout(deliverTimer);
  let list = outboxRead();
  const fresh = list.filter(function (x) { return x.round === round; });
  if (fresh.length !== list.length) { list = fresh; outboxWrite(list); }
  if (!list.length) return;
  const item = list[0];
  delivering = true;
  api('submit', { pid: pid, qid: item.qid, p: JSON.stringify(item.p) })
    .then(function (res) {
      delivering = false;
      outboxWrite(outboxRead().filter(function (x) { return !(sameItem(x, item) && JSON.stringify(x.p) === JSON.stringify(item.p)); }));
      if (!(res && res.ok)) {
        // Rejected for good (bad input): reopen that question.
        store.remove(localKeyFor(item.round, item.qid));
        toast(res && res.reason === 'email' ? 'Sprawdź adres e-mail' : 'Nie udało się zapisać odpowiedzi – spróbuj jeszcze raz.');
        if (item.round === round && QINDEX[item.qid] !== undefined) go(QINDEX[item.qid]);
      }
      deliver();
    })
    .catch(function () {
      delivering = false;
      const tries = (item.tries || 0) + 1;
      outboxWrite(outboxRead().map(function (x) { if (sameItem(x, item)) x.tries = tries; return x; }));
      if (tries === 3) toast('Słabe połączenie – odpowiedzi wyślę, jak tylko się da.');
      deliverTimer = setTimeout(deliver, Math.min(tries, 5) * 2000);
    });
}

/* ---------- round check ---------- */
// Only needed to notice a reset by the presenter, so it runs rarely.
let pollTimer = null;
function applyRound(r) {
  if (r === round) return;
  const first = round === null;
  round = r;
  cursor = firstOpen();
  screenKey = '';
  if (!first) window.scrollTo(0, 0);
  render();
  deliver();
}
function poll() {
  clearTimeout(pollTimer);
  api('view', { pid: pid })
    .then(function (v) { failures = 0; applyRound(v.round); schedule(); })
    .catch(function () { failures++; schedule(); });
}
function schedule() {
  pollTimer = setTimeout(poll, (document.hidden ? 30000 : 12000) + Math.min(failures, 5) * 2000);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && BOOT) { poll(); deliver(); } });
window.addEventListener('online', function () { deliver(); });

/* ---------- boot ---------- */
function start() {
  render();
  Promise.all([api('config'), api('view', { pid: pid })])
    .then(function (res) {
      const cfg = res[0];
      BOOT = cfg;
      QUESTIONS = cfg.questions;
      QUESTIONS.forEach(function (q, i) { QINDEX[q.id] = i; });
      document.getElementById('eyebrow').textContent = cfg.event.label;
      document.getElementById('title').textContent = cfg.event.title;
      document.getElementById('subtitle').textContent = cfg.event.subtitle;
      document.getElementById('footer').textContent = cfg.event.host;
      applyRound(res[1].round);
      schedule();
    })
    .catch(function () {
      failures++;
      if (failures === 2) toast('Słabe połączenie – ponawiam…');
      setTimeout(start, 2000 + Math.min(failures, 5) * 1000);
    });
}
start();
</script>
</body>
</html>
