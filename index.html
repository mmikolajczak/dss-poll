<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1e1e1e;
    --muted: #5d6a74;
    --line: #e4e9e7;
    --bg: #f5f7f6;
    --card: #ffffff;
    --brand: #0a7d71;
    --brand-2: #0e9f8f;
    --brand-soft: #e7f4f1;
    --green: #60d89b;
    --danger: #d6455d;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; color: var(--ink); }
  html { background: var(--bg); }
  body {
    font-family: 'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px; line-height: 1.45; min-height: 100vh; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(760px 380px at 8% -60px, rgba(96,216,155,.28), rgba(96,216,155,0) 70%),
      radial-gradient(620px 340px at 105% -40px, rgba(2,65,230,.10), rgba(2,65,230,0) 70%),
      var(--bg);
    background-repeat: no-repeat;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 124px; }
  header { padding: 6px 4px 20px; }
  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
  .title { font-size: 27px; line-height: 1.12; font-weight: 600; letter-spacing: -.025em; margin-top: 8px; }
  .subtitle { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .byline { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 13px; font-weight: 500; text-decoration: none; }
  .byline .logo { height: 20px; width: auto; color: var(--ink); display: block; }

  .card { background: var(--card); border-radius: var(--radius); border: 1px solid rgba(30,30,30,.05); box-shadow: 0 1px 2px rgba(16,32,28,.04), 0 14px 34px rgba(16,32,28,.07); padding: 20px 18px 22px; }
  .steps { display: flex; gap: 6px; margin-bottom: 16px; }
  .steps span { flex: 1; height: 5px; border-radius: 99px; background: #e7ecea; transition: background .3s; }
  .steps span.done { background: var(--brand-2); }
  .steps span.now { background: linear-gradient(90deg, var(--brand-2), var(--green)); }
  .qmeta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .back { font: inherit; font-size: 14px; font-weight: 600; color: var(--brand); background: none; border: 0; padding: 4px 0 4px 10px; cursor: pointer; }
  .pill { background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  h2 { font-size: 22px; line-height: 1.25; font-weight: 600; margin: 0 0 6px; letter-spacing: -.015em; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .hintrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .hintrow .hint { margin: 0; }

  .opts { display: grid; gap: 10px; margin-top: 16px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
    padding: 15px 14px; font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
  }
  .opt:active { transform: scale(.99); }
  @media (hover: hover) { .opt:hover { border-color: #c9d4d0; } }
  .opt .mark { flex: 0 0 22px; height: 22px; border: 2px solid #b9c5c1; border-radius: 50%; display: grid; place-items: center; transition: all .15s; }
  .opt.multi .mark { border-radius: 7px; }
  .opt.sel { border-color: var(--brand); background: var(--brand-soft); }
  .opt.sel .mark { border-color: var(--brand); background: var(--brand); }
  .opt.sel .mark::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .opt.multi.sel .mark::after { width: 10px; height: 6px; border-radius: 0; background: none; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  .opt.dim { opacity: .45; }

  .field { margin-top: 16px; }
  input[type=email] {
    width: 100%; font: inherit; font-size: 17px; padding: 15px 16px; border: 1.5px solid var(--line); border-radius: 16px; outline: none; background: #fff; color: var(--ink);
  }
  input[type=email]:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .check { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--brand); flex: 0 0 20px; }
  .fine { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(245,247,246,0), var(--bg) 38%); }
  .bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { flex: 1; font: inherit; font-size: 17px; font-weight: 600; border: 0; border-radius: 999px; padding: 16px; cursor: pointer; transition: opacity .15s, transform .08s, background .15s; }
  .btn:active { transform: scale(.99); }
  .btn.primary { background: var(--brand); color: #fff; box-shadow: 0 8px 22px rgba(10,125,113,.28); }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); flex: 0 0 auto; padding: 16px 24px; }
  .btn[disabled] { opacity: .4; box-shadow: none; cursor: default; }

  .center { text-align: center; padding: 34px 12px 30px; }
  .icon { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; }
  .icon.wait { background: var(--brand-soft); position: relative; }
  .icon.wait::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--brand-soft); animation: pulse 1.8s ease-out infinite; }
  .icon.wait span { width: 14px; height: 14px; border-radius: 50%; background: var(--brand); position: relative; }
  .icon.ok { background: var(--brand-soft); }
  .icon.ok span { width: 22px; height: 12px; border-left: 3.5px solid var(--brand); border-bottom: 3.5px solid var(--brand); transform: rotate(-45deg) translate(2px,-3px); }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
  .center h3 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
  .center p { margin: 0; color: var(--muted); }
  .center .after { margin-top: 14px; color: var(--ink); font-weight: 600; }
  .link { font: inherit; font-size: 14px; font-weight: 500; color: var(--brand); background: none; border: 0; margin-top: 18px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -80px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; transition: transform .25s; z-index: 10; max-width: 90vw; }
  .toast.show { transform: translate(-50%, 0); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>

ath d="M962.003 86.7027C962.003 78.5345 968.536 72.2041 976.698 72.2041C984.86 72.2041 991.388 78.5345 991.388 86.7027C991.388 94.8709 984.86 101.201 976.698 101.201C968.536 101.201 962.003 94.8709 962.003 86.7027ZM964.453 205.141V113.249H989.346V205.141H964.453Z" fill="currentColor"/><path d="M1012.21 134.487H1003.43V113.249H1012.21V89.7656H1037.1V113.249H1058.32V134.487H1037.1V183.495H1055.67V205.141H1012.21V134.487Z" fill="currentColor"/><path d="M443 0C419.088 13.8418 403 39.7133 403 69.3448C403 98.9763 419.088 124.848 443 138.69C466.912 124.848 483 98.9763 483 69.3448C483 39.7133 466.912 13.8418 443 0Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/><path d="M523.003 0C499.09 13.8418 483.002 39.7133 483.002 69.3448C483.002 98.9763 499.09 124.848 523.003 138.69C546.914 124.848 563 98.9763 563 69.3448C563 39.7133 546.914 13.8418 523.003 0Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/><path d="M493.002 215H473.003V235.013H493.002V215Z" fill="#0241E6"/><path d="M463.003 184.979H443.003V204.993H463.003V184.979Z" fill="#60D89B"/><path d="M523.003 184.979H503.003V204.993H523.003V184.979Z" fill="#ED5757"/><path d="M413.707 169.412H552.303C538.469 145.484 512.617 129.385 483.004 129.385C453.393 129.385 427.54 145.484 413.707 169.412Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/></g><defs><clipPath id="dr-logo-clip"><rect width="1056" height="235" fill="white"/></clipPath></defs></svg></a>

</div>
<div class="bar" id="bar" hidden><div class="bar-inner" id="barInner"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzWXRjwTN9aXXCgfoKTeRH2GLWFM8AjUpwA0jVUHKqLbfTFQiHyYPUP2tnjUmiOx_iO/exec';
let BOOT = null;
let QUESTIONS = [];
const QINDEX = {};

/* ---------- English copy (question text comes from the server in Polish; answers are stored by option index) ---------- */
const EN = {
  q1: { text: 'Where do you work?', options: ['Hospital / healthcare provider', 'Medtech / healthtech', 'Pharma / life sciences', 'IT vendor / consulting', 'Research / academia', 'Other'] },
  q2: { text: 'How far along is AI in your organization?', options: ['Not deploying yet', 'Pilot / PoC', 'Production – internal use', 'Production – with patients or customers'] },
  q3: { text: 'What worries you most about attacks on AI?', options: ['Data loss through our own AI systems (e.g. prompt injection)', 'Data loss at external AI vendors', 'Results that can’t be trusted (manipulated model)', 'Losing the model and IP', 'Systems going down (e.g. ransomware, infrastructure attacks)'] },
  q4: { text: 'Have you had a security incident caused directly by an attack on AI?', options: ['Yes', 'We were attacked, but without damage', 'No', 'I don’t know'] },
  q5: { text: 'Want the discussion notes and AI security guidelines?', hint: 'Leave your email – we’ll send them after the event.', consent: 'I’d also like occasional materials from datarabbit on AI security in healthcare.', privacy: 'We’ll only use your email to send the notes, unless you tick the box above.' }
};
function localize(qs) {
  return (qs || []).map(function (q) {
    const en = EN[q.id];
    if (!en) return q;
    if (en.options && (!q.options || q.options.length !== en.options.length)) return q;
    return Object.assign({}, q, en);
  });
}

/* ---------- transport ---------- */
function api(action, params) {
  const q = new URLSearchParams(Object.assign({ action: action, _: String(Date.now()) }, params || {}));
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 12000) : null;
  return fetch(API + '?' + q.toString(), { method: 'GET', credentials: 'omit', cache: 'no-store', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { if (timer) clearTimeout(timer); if (j && j.error) throw new Error(j.error); return j; })
    .catch(function (e) { if (timer) clearTimeout(timer); throw e; });
}

/* ---------- small helpers ---------- */
function h(tag, attrs, kids) {
  const el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'text') el.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}
const store = {
  mem: {},
  get: function (k) { try { const v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return this.mem[k] || null; },
  set: function (k, v) { this.mem[k] = v; try { window.localStorage.setItem(k, v); } catch (e) {} },
  remove: function (k) { delete this.mem[k]; try { window.localStorage.removeItem(k); } catch (e) {} }
};
function randId() {
  const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  try { const b = new Uint8Array(24); crypto.getRandomValues(b); b.forEach(function (x) { out += a[x % a.length]; }); }
  catch (e) { for (let i = 0; i < 24; i++) out += a[Math.floor(Math.random() * a.length)]; }
  return out;
}
let pid = store.get('drpoll_pid');
if (!pid || !/^[A-Za-z0-9_-]{8,64}$/.test(pid)) { pid = randId(); store.set('drpoll_pid', pid); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ---------- state ---------- */
// Self-paced: everyone goes through all questions on their own. Each answer is saved on the phone
// right away and delivered in the background, so a slow server never holds anyone up.
let round = null;          // answer round from the server; a reset by the presenter starts a new one
let cursor = 0;            // index of the question on screen; QUESTIONS.length = finished
let screenKey = '';
let selection = [];
let failures = 0;

function localKeyFor(r, qid) { return 'drpoll_ans_' + r + '_' + qid; }
function myAnswer(qid) { const v = store.get(localKeyFor(round, qid)); try { return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function firstOpen() { for (let i = 0; i < QUESTIONS.length; i++) if (!myAnswer(QUESTIONS[i].id)) return i; return QUESTIONS.length; }

/* ---------- screens ---------- */
const main = document.getElementById('main');
const bar = document.getElementById('bar');
const barInner = document.getElementById('barInner');

function setBar(buttons) {
  barInner.innerHTML = '';
  if (!buttons || !buttons.length) { bar.hidden = true; return; }
  buttons.forEach(function (b) { barInner.appendChild(b); });
  bar.hidden = false;
}

function renderConnecting() {
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'card center' }, [
    h('div', { class: 'icon wait' }, [h('span')]),
    h('h3', { text: 'Connecting…' }),
    h('p', { text: 'One moment.' })
  ]));
  setBar(null);
}

function questionHead(q, i) {
  const n = QUESTIONS.length;
  return [
    h('div', { class: 'steps' }, QUESTIONS.map(function (x, k) { return h('span', { class: k < i ? 'done' : k === i ? 'now' : '' }); })),
    h('div', { class: 'qmeta' }, [
      h('span', { text: 'Question ' + (i + 1) + ' of ' + n }),
      i > 0 ? h('button', { class: 'back', type: 'button', text: '‹ Back', onclick: function () { go(i - 1); } }) : null
    ]),
    h('h2', { text: q.text }),
    (q.hint || q.type === 'multi') ? h('div', { class: 'hintrow' }, [
      q.hint ? h('p', { class: 'hint', text: q.hint }) : h('span'),
      q.type === 'multi' ? h('span', { class: 'pill', id: 'counter', text: '0 / ' + (q.max || 2) }) : null
    ]) : null
  ];
}

function renderChoice(q, i) {
  const multi = q.type === 'multi';
  const max = multi ? (q.max || 2) : 1;
  const prev = myAnswer(q.id);
  selection = prev && prev.choices ? prev.choices.slice() : [];
  const nextBtn = h('button', { class: 'btn primary', text: 'Next', onclick: function () { answer(q, i, { choices: selection.slice() }); } });
  const opts = h('div', { class: 'opts' });
  let locked = false;
  const buttons = q.options.map(function (label, k) {
    const b = h('button', { class: 'opt' + (multi ? ' multi' : ''), type: 'button' }, [h('span', { class: 'mark' }), h('span', { text: label })]);
    b.addEventListener('click', function () {
      if (locked) return;
      const at = selection.indexOf(k);
      if (multi) {
        if (at >= 0) selection.splice(at, 1);
        else if (selection.length < max) selection.push(k);
        else { const c = document.getElementById('counter'); if (c) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } toast('You can pick up to ' + max); return; }
        paint();
      } else {
        // One tap is enough: show the choice for a moment, then move on.
        selection = [k];
        paint();
        locked = true;
        setTimeout(function () { answer(q, i, { choices: [k] }); }, 260);
      }
    });
    opts.appendChild(b);
    return b;
  });
  function paint() {
    buttons.forEach(function (b, k) {
      b.classList.toggle('sel', selection.indexOf(k) >= 0);
      b.classList.toggle('dim', multi && selection.length >= max && selection.indexOf(k) < 0);
    });
    if (multi) { const c = document.getElementById('counter'); if (c) c.textContent = selection.length + ' / ' + max; }
    if (selection.length) nextBtn.removeAttribute('disabled'); else nextBtn.setAttribute('disabled', 'disabled');
  }
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'card' }, questionHead(q, i).concat([opts])));
  paint();
  setBar(multi ? [nextBtn] : null);
}

function renderEmail(q, i) {
  const prev = myAnswer(q.id);
  const input = h('input', { type: 'email', inputmode: 'email', autocomplete: 'email', placeholder: 'you@email.com', 'aria-label': 'E-mail' });
  if (prev && prev.email) input.value = prev.email;
  const consent = h('input', { type: 'checkbox' });
  if (prev && prev.consent) consent.checked = true;
  const sendBtn = h('button', { class: 'btn primary', text: 'Send', onclick: function () {
    const email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { input.focus(); input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); toast('Check your email address'); return; }
    answer(q, i, { email: email, consent: consent.checked });
  } });
  const skipBtn = h('button', { class: 'btn ghost', text: 'Skip', onclick: function () {
    store.set(localKeyFor(round, q.id), JSON.stringify({ skipped: true }));
    go(i + 1);
  } });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendBtn.click(); });
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'card' }, questionHead(q, i).concat([
    h('div', { class: 'field' }, [input]),
    h('label', { class: 'check' }, [consent, h('span', { text: q.consent })]),
    h('p', { class: 'fine', text: q.privacy })
  ])));
  setBar([skipBtn, sendBtn]);
}

function renderDone() {
  const last = QUESTIONS[QUESTIONS.length - 1];
  const mail = last && last.type === 'email' ? myAnswer(last.id) : null;
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'card center' }, [
    h('div', { class: 'icon ok' }, [h('span')]),
    h('h3', { text: 'Thanks!' }),
    h('p', { text: mail && mail.email ? 'Answers saved. We’ll send the notes after the event.' : 'Answers saved.' }),
    h('p', { class: 'after', text: 'We’ll go through the results together at the table.' }),
    h('button', { class: 'link', type: 'button', text: 'Change answers', onclick: function () { go(0); } })
  ]));
  setBar(null);
}

function go(i) {
  cursor = Math.max(0, Math.min(i, QUESTIONS.length));
  screenKey = '';
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (!BOOT || round === null) { if (screenKey !== 'connecting') { screenKey = 'connecting'; renderConnecting(); } return; }
  const key = round + ':' + cursor;
  if (key === screenKey) return;
  screenKey = key;
  if (cursor >= QUESTIONS.length) { renderDone(); return; }
  const q = QUESTIONS[cursor];
  if (q.type === 'email') renderEmail(q, cursor);
  else renderChoice(q, cursor);
}

/* ---------- delivery ---------- */
// Answers go to a small outbox kept in localStorage and are sent one by one, retrying until the
// server confirms. Flaky conference Wi-Fi never blocks the phone, and a reload resumes delivery.
// Changing an answer just sends it again; the server counts the latest one.
const OUTBOX_KEY = 'drpoll_outbox';
function outboxRead() { try { return JSON.parse(store.get(OUTBOX_KEY) || '[]'); } catch (e) { return []; } }
function outboxWrite(list) { store.set(OUTBOX_KEY, JSON.stringify(list)); }
function sameItem(a, b) { return a.round === b.round && a.qid === b.qid; }
let delivering = false;
let deliverTimer = null;

function answer(q, i, payload) {
  const local = q.type === 'email' ? { email: payload.email, consent: !!payload.consent } : { choices: payload.choices };
  store.set(localKeyFor(round, q.id), JSON.stringify(local));
  const item = { round: round, qid: q.id, p: payload, tries: 0 };
  outboxWrite(outboxRead().filter(function (x) { return !sameItem(x, item); }).concat([item]));
  deliver();
  go(i + 1);
}

function deliver() {
  if (delivering || round === null) return;
  clearTimeout(deliverTimer);
  let list = outboxRead();
  const fresh = list.filter(function (x) { return x.round === round; });
  if (fresh.length !== list.length) { list = fresh; outboxWrite(list); }
  if (!list.length) return;
  const item = list[0];
  delivering = true;
  api('submit', { pid: pid, qid: item.qid, p: JSON.stringify(item.p) })
    .then(function (res) {
      delivering = false;
      outboxWrite(outboxRead().filter(function (x) { return !(sameItem(x, item) && JSON.stringify(x.p) === JSON.stringify(item.p)); }));
      if (!(res && res.ok)) {
        // Rejected for good (bad input): reopen that question.
        store.remove(localKeyFor(item.round, item.qid));
        toast(res && res.reason === 'email' ? 'Check your email address' : 'Couldn’t save your answer – please try again.');
        if (item.round === round && QINDEX[item.qid] !== undefined) go(QINDEX[item.qid]);
      }
      deliver();
    })
    .catch(function () {
      delivering = false;
      const tries = (item.tries || 0) + 1;
      outboxWrite(outboxRead().map(function (x) { if (sameItem(x, item)) x.tries = tries; return x; }));
      if (tries === 3) toast('Weak connection – your answers will be sent as soon as possible.');
      deliverTimer = setTimeout(deliver, Math.min(tries, 5) * 2000);
    });
}

/* ---------- round check ---------- */
// Only needed to notice a reset by the presenter, so it runs rarely.
let pollTimer = null;
function applyRound(r) {
  if (r === round) return;
  const first = round === null;
  round = r;
  cursor = firstOpen();
  screenKey = '';
  if (!first) window.scrollTo(0, 0);
  render();
  deliver();
}
function poll() {
  clearTimeout(pollTimer);
  api('view', { pid: pid })
    .then(function (v) { failures = 0; applyRound(v.round); schedule(); })
    .catch(function () { failures++; schedule(); });
}
function schedule() {
  pollTimer = setTimeout(poll, (document.hidden ? 30000 : 12000) + Math.min(failures, 5) * 2000);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && BOOT) { poll(); deliver(); } });
window.addEventListener('online', function () { deliver(); });

/* ---------- boot ---------- */
function start() {
  render();
  Promise.all([api('config'), api('view', { pid: pid })])
    .then(function (res) {
      const cfg = res[0];
      BOOT = cfg;
      QUESTIONS = localize(cfg.questions);
      QUESTIONS.forEach(function (q, i) { QINDEX[q.id] = i; });
      document.getElementById('eyebrow').textContent = cfg.event.label;
      document.getElementById('title').textContent = cfg.event.title;
      document.getElementById('subtitle').textContent = cfg.event.subtitle;
      applyRound(res[1].round);
      schedule();
    })
    .catch(function () {
      failures++;
      if (failures === 2) toast('Weak connection – retrying…');
      setTimeout(start, 2000 + Math.min(failures, 5) * 1000);
    });
}
start();
</script>
