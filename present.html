<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prowadzący · AI at scale in healthcare</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0c1730;
    --bg2: #12224a;
    --panel: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.12);
    --ink: #f4f7ff;
    --muted: #9fb0d1;
    --navy: #27406b;
    --accent: #2fd3b1;
    --accent2: #5aa0ff;
    --danger: #ff6b81;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 85% -10%, #1d3a78 0%, rgba(29,58,120,0) 60%), linear-gradient(160deg, var(--bg2), var(--bg) 60%);
    color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); padding: 26px 34px 18px; gap: 20px; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .ttl { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; }
  .sub { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .stats { display: flex; gap: 10px; align-items: center; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(47,211,177,.18); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 0 4px rgba(255,107,129,.18); }

  .stage { display: grid; grid-template-columns: minmax(240px, 30%) minmax(0, 1fr); gap: 34px; min-height: 0; }
  .qrcard { background: #fff; color: #0f1b33; border-radius: 26px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.35); align-self: center; }
  .qrbox { width: 100%; max-width: 340px; aspect-ratio: 1; display: grid; place-items: center; }
  .qrbox svg, .qrbox img { width: 100%; height: 100%; display: block; }
  .scan { font-size: 22px; font-weight: 800; margin-top: 16px; letter-spacing: -.01em; }
  .url { font-size: 11px; color: #6b7690; margin-top: 8px; word-break: break-all; font-family: ui-monospace, 'Roboto Mono', monospace; max-width: 340px; }

  .panel { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .qnum { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 14px; align-items: center; }
  .qnum .chip { background: rgba(47,211,177,.12); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-size: 13px; letter-spacing: 0; text-transform: none; }
  .qtext { font-size: clamp(28px, 3.3vw, 46px); font-weight: 800; line-height: 1.15; letter-spacing: -.02em; margin: 10px 0 26px; }
  .bars { display: grid; gap: 16px; position: relative; }
  .brow .blbl { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: clamp(16px, 1.45vw, 21px); font-weight: 600; margin-bottom: 7px; }
  .brow .blbl .n { color: var(--muted); font-weight: 600; font-size: .85em; margin-left: 8px; }
  .brow .blbl b { font-size: 1.15em; font-weight: 800; }
  .btrack { height: 16px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bfill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent2), #8cc0ff); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .brow.lead .bfill { background: linear-gradient(90deg, var(--accent), #7ff0d8); }
  .meta { margin-top: 22px; color: var(--muted); font-size: 16px; font-weight: 600; }
  .veil { position: absolute; inset: -8px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: rgba(12,23,48,.55); border-radius: 18px; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: var(--ink); }
  .big { font-size: clamp(64px, 9vw, 130px); font-weight: 800; letter-spacing: -.03em; line-height: 1; color: var(--accent); }
  .bigsub { font-size: 22px; color: var(--muted); margin-top: 10px; }
  .welcome .qtext { margin-bottom: 14px; }
  .welcome p { font-size: 20px; color: var(--muted); margin: 0; max-width: 680px; }

  .dock { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0; padding-top: 12px; border-top: 1px solid var(--line); opacity: .55; transition: opacity .2s; }
  .dock:hover, .dock:focus-within { opacity: 1; }
  .dbtn { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; cursor: pointer; white-space: nowrap; max-width: 230px; flex: 0 0 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .dbtn.q { flex: 1 1 0; }
  .dbtn:hover { background: rgba(255,255,255,.12); }
  .dbtn.on { background: var(--accent); color: #062a24; border-color: var(--accent); }
  .dbtn.warn { color: var(--danger); }
  .sp { flex: 1; }
  .kbd { font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; }

  .qrfull { position: fixed; inset: 0; background: #fff; color: #0f1b33; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; cursor: pointer; }
  .qrfull.show { display: flex; }
  .qrfull .qrbox { max-width: min(78vh, 80vw); }
  .qrfull .scan { font-size: 34px; }
  .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #fff; color: #0f1b33; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; }

  /* Small projectors / laptops: keep a 6-option question and the dock on one screen. */
  @media (max-width: 1700px) { .kbd { display: none; } }
  @media (max-height: 820px) {
    .app { padding: 18px 26px 12px; gap: 12px; }
    .ttl { font-size: 19px; } .sub { font-size: 13px; } .eyebrow { font-size: 12px; }
    .stage { gap: 26px; }
    .qrcard { padding: 18px; border-radius: 22px; }
    .qrbox { max-width: 270px; }
    .scan { font-size: 18px; margin-top: 10px; }
    .qtext { font-size: clamp(24px, 2.7vw, 36px); margin: 6px 0 14px; }
    .bars { gap: 9px; }
    .brow .blbl { font-size: 15px; margin-bottom: 4px; }
    .btrack { height: 11px; }
    .meta { margin-top: 10px; font-size: 14px; }
    .dbtn { font-size: 13px; padding: 7px 11px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <div class="ttl" id="ttl"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="stats">
      <span class="stat"><span class="dot" id="conn"></span><span id="people">0 osób</span></span>
    </div>
  </div>

  <div class="stage">
    <div class="qrcard" id="qrcard" title="Kliknij, żeby powiększyć">
      <div class="qrbox" id="qr"></div>
      <div class="scan">Zeskanuj, żeby głosować</div>
      <div class="url" id="url"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>

  <div class="dock" id="dock"></div>
</div>

<div class="qrfull" id="qrfull" title="Kliknij, żeby zamknąć">
  <div class="qrbox" id="qr2"></div>
  <div class="scan">Zeskanuj, żeby głosować</div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzWXRjwTN9aXXCgfoKTeRH2GLWFM8AjUpwA0jVUHKqLbfTFQiHyYPUP2tnjUmiOx_iO/exec';
const KEY = decodeURIComponent((location.hash || '').replace(/^#/, '')) || new URLSearchParams(location.search).get('key') || '';
const PARTICIPANT_URL = new URL('./', location.href).href;
let BOOT = null;
let QUESTIONS = [];
const QINDEX = {};

/* ---------- transport ---------- */
function api(action, params) {
  const q = new URLSearchParams(Object.assign({ action: action, _: String(Date.now()) }, params || {}));
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 12000) : null;
  return fetch(API + '?' + q.toString(), { method: 'GET', credentials: 'omit', cache: 'no-store', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { if (timer) clearTimeout(timer); if (j && j.error) throw new Error(j.error); return j; })
    .catch(function (e) { if (timer) clearTimeout(timer); throw e; });
}

function h(tag, attrs, kids) {
  const el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'text') el.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400); }
function plural(n, one, few, many) { if (n === 1) return one; const d = n % 10, dd = n % 100; return (d >= 2 && d <= 4 && (dd < 10 || dd >= 20)) ? few : many; }

/* ---------- QR ---------- */
document.getElementById('url').textContent = PARTICIPANT_URL.replace(/^https?:\/\//, '').replace(/\/$/, '');
function drawQR(box) {
  box.innerHTML = '';
  try {
    const qr = qrcode(0, 'M');
    qr.addData(PARTICIPANT_URL);
    qr.make();
    const n = qr.getModuleCount();
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '-2 -2 ' + (n + 4) + ' ' + (n + 4));
    svg.setAttribute('shape-rendering', 'crispEdges');
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
    const bg = document.createElementNS(ns, 'rect');
    bg.setAttribute('x', -2); bg.setAttribute('y', -2); bg.setAttribute('width', n + 4); bg.setAttribute('height', n + 4); bg.setAttribute('fill', '#fff');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d); path.setAttribute('fill', '#0f1b33');
    svg.appendChild(bg); svg.appendChild(path);
    box.appendChild(svg);
  } catch (e) {
    box.appendChild(h('img', { alt: 'QR', src: 'https://api.qrserver.com/v1/create-qr-code/?size=800x800&margin=8&data=' + encodeURIComponent(PARTICIPANT_URL) }));
  }
}
function initQR() { drawQR(document.getElementById('qr')); drawQR(document.getElementById('qr2')); }
if (window.qrcode) initQR(); else window.addEventListener('load', initQR);
document.getElementById('qrcard').addEventListener('click', function () { document.getElementById('qrfull').classList.add('show'); });
document.getElementById('qrfull').addEventListener('click', function () { this.classList.remove('show'); });

/* ---------- state ---------- */
let state = null, results = null;
let panelKey = '';
let busy = false;
let failures = 0;

/* ---------- panel ---------- */
const panel = document.getElementById('panel');

function renderMessage(title, text) {
  panel.innerHTML = '';
  panel.appendChild(h('div', { class: 'welcome' }, [
    h('div', { class: 'qnum', text: 'Round table' }),
    h('div', { class: 'qtext', text: title }),
    text ? h('p', { text: text }) : null
  ]));
}

function renderWelcome() {
  renderMessage('Zeskanuj kod i zostań na stronie', 'Kilka krótkich pytań – wyniki omówimy razem przy stole.');
}

function renderQuestion(q) {
  panel.innerHTML = '';
  const idx = QINDEX[q.id];
  panel.appendChild(h('div', { class: 'qnum' }, [
    h('span', { text: 'Pytanie ' + (idx + 1) + ' / ' + QUESTIONS.length }),
    q.type === 'multi' ? h('span', { class: 'chip', text: 'max ' + (q.max || 2) + ' odpowiedzi' }) : null
  ]));
  panel.appendChild(h('div', { class: 'qtext', text: q.text }));
  if (q.type === 'email') {
    panel.appendChild(h('div', {}, [
      h('div', { class: 'big', id: 'emailCount', text: '0' }),
      h('div', { class: 'bigsub', id: 'emailSub', text: 'osób zostawiło maila' })
    ]));
    panel.appendChild(h('div', { class: 'meta', text: 'Adresy trafiają tylko do prywatnego arkusza – nie pokazujemy ich tutaj.' }));
    return;
  }
  const bars = h('div', { class: 'bars', id: 'bars' });
  q.options.forEach(function (label, i) {
    bars.appendChild(h('div', { class: 'brow', 'data-i': i }, [
      h('div', { class: 'blbl' }, [h('span', {}, [h('span', { text: label }), h('span', { class: 'n' })]), h('b', { class: 'pct', text: '0%' })]),
      h('div', { class: 'btrack' }, [h('div', { class: 'bfill' })])
    ]));
  });
  panel.appendChild(bars);
  panel.appendChild(h('div', { class: 'meta', id: 'meta' }));
}

function paintPanel() {
  if (!state || !state.active || !BOOT) return;
  const q = QUESTIONS[QINDEX[state.active]];
  if (!q) return;
  const R = results && results.byQ[q.id] ? results.byQ[q.id] : { total: 0, counts: q.options ? q.options.map(function () { return 0; }) : null };
  if (q.type === 'email') {
    document.getElementById('emailCount').textContent = R.total;
    document.getElementById('emailSub').textContent = plural(R.total, 'osoba zostawiła maila', 'osoby zostawiły maila', 'osób zostawiło maila');
    return;
  }
  const total = R.total || 0;
  const max = Math.max.apply(null, R.counts.concat([0]));
  document.querySelectorAll('#bars .brow').forEach(function (row) {
    const i = Number(row.getAttribute('data-i'));
    const n = R.counts[i] || 0;
    const pct = total ? Math.round(n * 100 / total) : 0;
    row.querySelector('.pct').textContent = pct + '%';
    row.querySelector('.n').textContent = n ? '· ' + n : '';
    row.querySelector('.bfill').style.width = pct + '%';
    row.classList.toggle('lead', n > 0 && n === max);
  });
  document.getElementById('meta').textContent = total + ' ' + plural(total, 'odpowiedź', 'odpowiedzi', 'odpowiedzi') + (q.type === 'multi' ? ' · procent osób, każdy mógł wybrać do ' + (q.max || 2) : '');
  const bars = document.getElementById('bars');
  let veil = document.getElementById('veil');
  if (state.hidden && !veil) { veil = h('div', { class: 'veil', id: 'veil', text: 'Wyniki ukryte' }); bars.appendChild(veil); }
  if (!state.hidden && veil) veil.remove();
}

function render() {
  if (!BOOT) return;
  const key = state && state.active ? state.round + ':' + state.active : 'welcome';
  if (key !== panelKey) {
    panelKey = key;
    if (!state || !state.active || !QUESTIONS[QINDEX[state.active]]) renderWelcome();
    else renderQuestion(QUESTIONS[QINDEX[state.active]]);
  }
  paintPanel();
  const p = results ? results.participants : 0;
  document.getElementById('people').textContent = p + ' ' + plural(p, 'osoba', 'osoby', 'osób');
  renderDock();
}

/* ---------- dock ---------- */
let resetArmed = false, resetTimer, dockKey = '';
function renderDock() {
  const active = state ? state.active : null;
  const k = [active, state && state.hidden, resetArmed].join('|');
  if (k === dockKey) return;
  dockKey = k;
  const dock = document.getElementById('dock');
  dock.innerHTML = '';
  QUESTIONS.forEach(function (q, i) {
    dock.appendChild(h('button', { class: 'dbtn q' + (active === q.id ? ' on' : ''), title: q.text, text: (i + 1) + '. ' + q.text, onclick: function () { setActive(q.id); } }));
  });
  dock.appendChild(h('span', { class: 'sp' }));
  dock.appendChild(h('button', { class: 'dbtn', text: state && state.hidden ? 'Pokaż wyniki' : 'Ukryj wyniki', onclick: toggleHidden }));
  dock.appendChild(h('button', { class: 'dbtn', text: 'Zatrzymaj', onclick: function () { setActive(null); } }));
  dock.appendChild(h('button', { class: 'dbtn', text: 'Duży QR', onclick: function () { document.getElementById('qrfull').classList.add('show'); } }));
  dock.appendChild(h('button', { class: 'dbtn warn', text: resetArmed ? 'Na pewno? Kliknij jeszcze raz' : 'Wyzeruj wyniki', onclick: resetResults }));
  dock.appendChild(h('span', { class: 'kbd', text: '← → pytania · H ukryj · S stop · Q kod' }));
}

/* ---------- actions ---------- */
// Admin actions go out one at a time, in click order. Consecutive show/hide/switch
// clicks are merged, so fast key presses never race each other on the server.
let queue = [];
let sending = false;
let actionSeq = 0;
function enqueue(action, patch, onOk) {
  actionSeq++;
  busy = true;
  const last = queue[queue.length - 1];
  if (action === 'aset' && last && last.action === 'aset') Object.assign(last.patch, patch);
  else queue.push({ action: action, patch: patch ? Object.assign({}, patch) : null, onOk: onOk });
  flush();
}
function flush() {
  if (sending || !queue.length) return;
  const op = queue.shift();
  sending = true;
  const params = { key: KEY };
  if (op.patch) params.p = JSON.stringify(op.patch);
  api(op.action, params)
    .then(function (v) {
      sending = false;
      if (!queue.length) { busy = false; failures = 0; state = v.state; results = v.results; render(); }
      if (op.onOk) op.onOk();
      flush();
    })
    .catch(function (e) {
      sending = false; queue = []; busy = false;
      toast('Błąd: ' + (e && e.message ? e.message : 'połączenie') + ' – spróbuj jeszcze raz');
      poll();
    });
}
function setActive(qid) {
  if (state) { state.active = qid; render(); }
  enqueue('aset', { active: qid });
}
function toggleHidden() {
  const next = !(state && state.hidden);
  if (state) { state.hidden = next; render(); }
  enqueue('aset', { hidden: next });
}
function resetResults() {
  if (!resetArmed) {
    resetArmed = true; renderDock();
    clearTimeout(resetTimer); resetTimer = setTimeout(function () { resetArmed = false; renderDock(); }, 4000);
    return;
  }
  resetArmed = false; clearTimeout(resetTimer);
  enqueue('areset', null, function () { toast('Wyniki wyzerowane – nowa runda'); });
}
function step(dir) {
  const cur = state && state.active ? QINDEX[state.active] : -1;
  let next = cur + dir;
  if (next < 0) next = 0;
  if (next >= QUESTIONS.length) next = QUESTIONS.length - 1;
  setActive(QUESTIONS[next].id);
}
document.addEventListener('keydown', function (e) {
  if (!BOOT) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'h' || e.key === 'H') toggleHidden();
  else if (e.key === 's' || e.key === 'S') setActive(null);
  else if (e.key === 'q' || e.key === 'Q') document.getElementById('qrfull').classList.toggle('show');
  else if (e.key === 'Escape') document.getElementById('qrfull').classList.remove('show');
});

/* ---------- polling ---------- */
let pollTimer;
function poll() {
  clearTimeout(pollTimer);
  if (busy) { pollTimer = setTimeout(poll, 700); return; }
  const seq = actionSeq;
  api('aview', { key: KEY })
    .then(function (v) {
      failures = 0;
      document.getElementById('conn').classList.remove('bad');
      // Ignore a snapshot taken before the presenter's latest click.
      if (!busy && seq === actionSeq) { state = v.state; results = v.results; render(); }
      pollTimer = setTimeout(poll, 2000);
    })
    .catch(function (e) {
      failures++;
      if (failures >= 2) document.getElementById('conn').classList.add('bad');
      if (e && /Brak dost/.test(e.message)) { renderMessage('Brak dostępu', 'Ten link prowadzącego jest niepełny – brakuje klucza po znaku #.'); return; }
      pollTimer = setTimeout(poll, 2000 + Math.min(failures, 5) * 1000);
    });
}

/* ---------- boot ---------- */
function start() {
  api('config')
    .then(function (cfg) {
      BOOT = cfg;
      QUESTIONS = cfg.questions;
      QUESTIONS.forEach(function (q, i) { QINDEX[q.id] = i; });
      document.getElementById('eyebrow').textContent = cfg.event.label;
      document.getElementById('ttl').textContent = cfg.event.title;
      document.getElementById('sub').textContent = cfg.event.subtitle;
      render();
      poll();
    })
    .catch(function () {
      failures++;
      document.getElementById('conn').classList.add('bad');
      setTimeout(start, 2000 + Math.min(failures, 5) * 1000);
    });
}
renderMessage('Łączę…', '');
start();
</script>
</body>
</html>
